<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">


<title>จัดการงานซ่อม | Gearix</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
rel="stylesheet">


<link rel="stylesheet" href="./css/admin.css">


</head>


<body>




<div class="sidebar">


<h3>

<i class="fa-solid fa-user-shield"></i>

Admin

</h3>



<a href="index.html">

<i class="fa-solid fa-chart-line"></i>

Dashboard

</a>



<a href="repairs.html">

<i class="fa-solid fa-screwdriver-wrench"></i>

Repair Cases

</a>



<a href="users.html">

<i class="fa-solid fa-users"></i>

จัดการสมาชิก

</a>



<button id="logout">

<i class="fa-solid fa-right-from-bracket"></i>

ออกจากระบบ

</button>


</div>






<div class="content">


<h2>

<i class="fa-solid fa-screwdriver-wrench"></i>

จัดการงานซ่อม

</h2>


<hr>





<button

class="btn btn-primary mb-3"

data-bs-toggle="modal"

data-bs-target="#createRepair">


<i class="fa-solid fa-plus"></i>

เปิดเคสใหม่


</button>








<table class="table table-dark table-striped">

<thead>

<tr>

<th>ลูกค้า</th>

<th>อีเมล</th>

<th>อุปกรณ์</th>

<th>รายละเอียดปัญหา</th>

<th>สถานะ</th>

<th>ช่างผู้รับผิดชอบ</th>

<th>วันที่</th>

<th>จัดการ</th>

</tr>

</thead>


<tbody id="repairTable">

</tbody>


</table>









<!-- Modal เปิดเคส -->

<!-- Modal เปิดเคสใหม่ -->

<div class="modal fade" id="createRepair" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="fa-solid fa-screwdriver-wrench"></i>

                    เปิดเคสซ่อมใหม่

                </h5>


                <button 
                type="button" 
                class="btn-close"
                data-bs-dismiss="modal">
                </button>

            </div>





            <div class="modal-body">


                <!-- ลูกค้า: มีบัญชี หรือ ไม่มีบัญชี (วอล์กอิน) -->

                <label class="form-label">

                    <i class="fa-solid fa-user"></i>

                    ลูกค้า

                </label>


                <div class="btn-group w-100 mb-3" role="group" id="caseCustomerMode">
                    <button type="button" class="btn btn-outline-primary" data-mode="account">มีบัญชี</button>
                    <button type="button" class="btn btn-primary" data-mode="guest">ไม่มีบัญชี (วอล์กอิน)</button>
                </div>


                <div id="accountFields">
                    <select 
                    id="customerSelect"
                    class="form-select mb-3">


                        <option value="">

                            -- เลือกลูกค้า --

                        </option>


                    </select>
                </div>


                <div id="guestFields" style="display:none;">
                    <input 
                    type="text" 
                    id="guestName" 
                    class="form-control mb-2" 
                    placeholder="ชื่อลูกค้า (เช่น สมชาย ใจดี)">
                    <input 
                    type="text" 
                    id="guestPhone" 
                    class="form-control mb-3" 
                    placeholder="เบอร์โทร (เช่น 0891234567)">
                </div>






                <!-- อุปกรณ์ -->


                <label class="form-label">

                    <i class="fa-solid fa-laptop"></i>

                    อุปกรณ์

                </label>


                <input

                type="text"

                id="device"

                class="form-control mb-3"

                placeholder="เช่น Notebook Acer">


                <!-- Serial Number -->

<label class="form-label">

<i class="fa-solid fa-barcode"></i>

Serial Number (SN)

</label>


<div class="input-group mb-3">

<input

type="text"

id="sn"

class="form-control"

placeholder="เช่น SN-A123456789">

<button
type="button"
id="genSnBtn"
class="btn btn-secondary"
title="ไม่ทราบ SN ระบบจะสุ่มให้">

<i class="fa-solid fa-shuffle"></i>
สุ่ม SN

</button>

</div>






                <!-- ปัญหา -->


                <label class="form-label">


                    <i class="fa-solid fa-triangle-exclamation"></i>

                    รายละเอียดปัญหา
                </label>
                <textarea
                id="detail"
                class="form-control"
                rows="4"
                placeholder="เช่น เปิดเครื่องไม่ได้, จอไม่ติด"></textarea>
            </div>







            <div class="modal-footer">


                <button

                type="button"

                class="btn btn-secondary"

                data-bs-dismiss="modal">


                    <i class="fa-solid fa-xmark"></i>

                    ปิด


                </button>





                <button

                type="button"

                class="btn btn-success"

                id="createBtn">


                    <i class="fa-solid fa-check"></i>

                    เปิดเคส


                </button>


            </div>




        </div>

    </div>

</div>









<!-- Floating chat -->
<button class="chat-float" id="openChat" aria-label="เปิดแชท"><i class="fa-solid fa-headset"></i></button>

<div class="chat-popup wide" id="chatPopup">
  <div class="chat-contacts" id="chatContacts">
    <div class="notif-empty">กำลังโหลดรายชื่อ...</div>
  </div>
  <div class="chat-main">
    <div class="chat-header">
      <span id="chatWithName"><i class="fa-solid fa-headset"></i> เลือกลูกค้า</span>
      <button id="closeChat">&times;</button>
    </div>
    <div class="chat-actions" id="chatActions" style="display:none;">
      <button id="openCaseFromChat"><i class="fa-solid fa-plus"></i> เปิดเคสใหม่ให้ลูกค้ารายนี้</button>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="notif-empty">เลือกลูกค้าทางด้านซ้ายเพื่อเริ่มแชท</div>
    </div>
    <div class="chat-footer">
      <input type="text" id="messageInput" placeholder="พิมพ์ข้อความ..." disabled>
      <button id="sendBtn" disabled>ส่ง</button>
    </div>
  </div>
</div>

<div class="ind-toast" id="indToast"></div>

<script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>



<script 
type="module"
src="./js/admin-repair.js">
</script>

<script type="module" src="./js/admin-chat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="./js/animations.js"></script>

</body>

</html>
