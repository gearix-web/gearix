<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>เข้าสู่ระบบช่าง / ผู้ดูแลระบบ | Gearix</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0"></script>

<link rel="stylesheet" href="css/login.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="particles-js"></div>

<div id="loading">
<div class="intro-inner">
<div class="intro-gear"><i class="bi bi-gear-fill"></i></div>
<div class="intro-brand">Gearix</div>
<div class="intro-sub">Industrial Machine Repair Co.</div>
<div class="intro-bar"><div class="intro-bar-fill"></div></div>
</div>
</div>
<body>

<div class="card card-box">

<div class="row g-0">

<div class="col-md-5 left-side d-flex flex-column justify-content-center">

<div class="rivet rivet-tl"></div>
<div class="rivet rivet-tr"></div>
<div class="rivet rivet-bl"></div>
<div class="rivet rivet-br"></div>

<div class="left-content">

<div class="brand-mark">
<i class="bi bi-gear-fill gear-icon"></i>
<span class="name">Gearix</span>
</div>

<div class="eyebrow-tag">Industrial Machine Repair Co.</div>

<h3 id="typed"></h3>

<p class="left-subcopy">
ระบบติดตามงานซ่อมออนไลน์
สำหรับลูกค้าและช่างเทคนิค
</p>


</div>

</div>

<div class="col-md-7 p-5">

<div class="panel-eyebrow">Staff Access</div>
<div class="panel-heading">เข้าสู่ระบบช่าง / ผู้ดูแลระบบ</div>

<ul class="nav nav-tabs mb-4">

<li class="nav-item">
<button
class="nav-link active"
data-bs-toggle="tab"
data-bs-target="#login">
เข้าสู่ระบบ
</button>
</li>

<li class="nav-item">
<button
class="nav-link"
data-bs-toggle="tab"
data-bs-target="#register">
สมัครสมาชิก
</button>
</li>

</ul>

<div class="tab-content">

<div class="tab-pane fade show active" id="login">

<form id="loginForm">

<div class="mb-3">
<input
type="email"
id="loginEmail"
class="form-control"
placeholder="Email"
required>
</div>

<div class="mb-3">
<input
type="password"
id="loginPassword"
class="form-control"
placeholder="Password"
required>
</div>

<button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button>

</form>

</div>

<div class="tab-pane fade" id="register">

<form id="registerForm">

<div class="mb-3">
<input
type="text"
id="fullname"
class="form-control"
placeholder="ชื่อ-นามสกุล"
required>
</div>

<div class="mb-3">
<input
type="text"
id="phone"
class="form-control"
placeholder="เบอร์โทร"
required>
</div>

<div class="mb-3">
<input
type="email"
id="email"
class="form-control"
placeholder="Email"
required>
</div>

<div class="mb-3">
<input
type="password"
id="password"
class="form-control"
placeholder="Password (อย่างน้อย 6 ตัว)"
required>
</div>

<div class="alert alert-warning py-2 mb-0" style="font-size:.85rem;">
<i class="bi bi-hourglass-split"></i>
สมัครแล้วต้องรอผู้ดูแลระบบอนุมัติก่อน จึงจะเข้าสู่ระบบได้
</div>

<button type="submit" class="btn btn-success w-100">ส่งคำขอสมัครสมาชิก</button>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/auth.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>

window.onload=()=>{

// อยากให้อินโทรได้ "โชว์ตัว" อย่างน้อยสักครู่ ไม่ใช่วูบหายไปทันทีถ้าโหลดเร็วมาก
// (performance.now() คือเวลาที่ผ่านไปนับจาก navigation เริ่มต้น ใช้แทนตัวจับเวลาได้เลย)
const MIN_INTRO_MS = 900;
const introEl = document.getElementById("loading");
const wait = Math.max(0, MIN_INTRO_MS - performance.now());

setTimeout(() => {
  introEl.classList.add("hide");
  introEl.addEventListener("transitionend", () => { introEl.style.display = "none"; }, { once: true });
}, wait);

AOS.init();

new Typed("#typed",{

strings:[

"Repair Tracking System",

"Real-time Updates",

"Online Service"

],

typeSpeed:60,

backSpeed:35,

loop:true

});

particlesJS("particles-js",{
    particles:{
        number:{value:45},
        shape:{type:"triangle"},
        color:{value:"#F2B705"},
        size:{value:2.5},
        opacity:{value:0.25},
        move:{speed:1.2},
        line_linked:{
            enable:true,
            color:"#4a5158",
            opacity:0.3
        }
    }
});

}

</script>

<script type="module" src="js/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="js/animations.js"></script>
</body>
</html>
