<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>แดชบอร์ดผู้ดูแลระบบ | Gearix</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/admin.css" />
  </head>

  <body>

    <div class="sidebar">
      <h3>
        <i class="fa-solid fa-user-shield"></i>
        Admin
      </h3>

      <a href="index.html">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
      </a>

      <a href="repairs.html">
        <i class="fa-solid fa-screwdriver-wrench"></i>
        Repair Cases
      </a>

      <a href="users.html">
        <i class="fa-solid fa-users"></i>
        จัดการสมาชิก
      </a>

      <button id="logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        ออกจากระบบ
      </button>
    </div>

    <div class="content">
      <div class="dash-head">
        <div>
          <div class="dash-eyebrow">Overview</div>
          <h2>Dashboard</h2>
        </div>

        <div class="status-chip">
          <span class="status-dot"></span>
          Live Data
        </div>
      </div>

      <div class="row">
        <div class="col-md-3">
          <div class="card-box">
            <i class="fa-solid fa-users"></i>

            <h5>ผู้ใช้ทั้งหมด</h5>

            <h2 id="userCount">0</h2>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-box">
            <i class="fa-solid fa-user-gear"></i>

            <h5>ช่างเทคนิค</h5>

            <h2 id="techCount">0</h2>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-box">
            <i class="fa-solid fa-user"></i>

            <h5>ลูกค้า</h5>

            <h2 id="customerCount">0</h2>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-box">
            <i class="fa-solid fa-ticket"></i>

            <h5>เคสงานซ่อม</h5>

            <h2 id="caseCount">0</h2>
          </div>
        </div>
      </div>

      <!-- account list table kept in the DOM (hidden) so admin.js can still target #userTable safely -->
      <div class="d-none">
        <hr />

        <h3>รายชื่อผู้ใช้</h3>

        <table class="table table-dark table-striped">
          <thead>
            <tr>
              <th>ชื่อ</th>

              <th>อีเมล</th>

              <th>ตำแหน่ง</th>

              <th>จัดการ</th>
            </tr>
          </thead>

          <tbody id="userTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Floating chat -->
    <button class="chat-float" id="openChat" aria-label="เปิดแชท"><i class="fa-solid fa-headset"></i></button>

    <div class="chat-popup wide" id="chatPopup">
      <div class="chat-contacts" id="chatContacts">
        <div class="notif-empty">กำลังโหลดรายชื่อ...</div>
      </div>
      <div class="chat-main">
        <div class="chat-header">
          <span id="chatWithName"><i class="fa-solid fa-headset"></i> เลือกลูกค้า</span>
          <button id="closeChat">&times;</button>
        </div>
        <div class="chat-actions" id="chatActions" style="display:none;">
          <button id="openCaseFromChat"><i class="fa-solid fa-plus"></i> เปิดเคสใหม่ให้ลูกค้ารายนี้</button>
        </div>
        <div class="chat-body" id="chatBody">
          <div class="notif-empty">เลือกลูกค้าทางด้านซ้ายเพื่อเริ่มแชท</div>
        </div>
        <div class="chat-footer">
          <input type="text" id="messageInput" placeholder="พิมพ์ข้อความ..." disabled>
          <button id="sendBtn" disabled>ส่ง</button>
        </div>
      </div>
    </div>

    <div class="ind-toast" id="indToast"></div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./js/admin.js"></script>
    <script type="module" src="./js/admin-chat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="./js/animations.js"></script>
  </body>
</html>
